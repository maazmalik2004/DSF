<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Election Fairness – Fixed Graph, Radial Layout</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    #chart-container {
      width: 900px;
      border: 1px solid #ccc;
      margin: 20px 0;
      padding: 10px;
      background: #f9f9f9;
    }
    canvas { display: block; }
    .graph-container {
      margin: 30px 0;
      border-top: 1px dashed #aaa;
      padding-top: 20px;
    }
    #stats-info { font-size: 16px; margin: 15px 0; }
  </style>
</head>
<body>

<h2>Election Fairness (Fixed Graph, Fixed Initiator)</h2>
<p id="stats">Running...</p>

<div id="stats-info">
  Expected probability per node: <strong>0.001</strong><br>
  <span id="mean-var">Calculating statistics...</span>
</div>

<div id="chart-container">
  <canvas id="chart" width="900" height="400"></canvas>
</div>

<h2>Fixed Graph (Radial Layout by Hop Distance)</h2>
<div id="graphs"></div>

<script>
/* ---------------- Parameters ---------------- */
const N = 1000;
const RUNS = 100000;
const EDGE_PROB = 0.01;

const BIN_SIZE = 50;
const NUM_BINS = Math.ceil(N / BIN_SIZE);

/* ---------------- DOM ---------------- */
const canvas = document.getElementById("chart");
const ctx = canvas.getContext("2d");
const statsEl = document.getElementById("stats");
const meanVarEl = document.getElementById("mean-var");
const graphsDiv = document.getElementById("graphs");

/* ---------------- State ---------------- */
let winsPerNode = new Array(N).fill(0);
let completedRuns = 0;

/* ---------------- Graph Generation ---------------- */
function randomGraph(n) {
  let adj = Array.from({ length: n }, () => []);
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      if (Math.random() < EDGE_PROB) {
        adj[i].push(j);
        adj[j].push(i);
      }
    }
  }
  for (let i = 1; i < n; i++) {
    if (adj[i].length === 0) {
      let j = Math.floor(Math.random() * i);
      adj[i].push(j);
      adj[j].push(i);
    }
  }
  return adj;
}

const FIXED_GRAPH = randomGraph(N);
const FIXED_INITIATOR = Math.floor(Math.random() * N);

/* ---------------- Hop Distances ---------------- */
function computeHopDistances(adj, source) {
  let dist = new Array(adj.length).fill(Infinity);
  let q = [source];
  dist[source] = 0;

  while (q.length) {
    let u = q.shift();
    for (let v of adj[u]) {
      if (dist[v] === Infinity) {
        dist[v] = dist[u] + 1;
        q.push(v);
      }
    }
  }
  return dist;
}

const HOP_DIST = computeHopDistances(FIXED_GRAPH, FIXED_INITIATOR);
const MAX_HOP = Math.max(...HOP_DIST.filter(d => d < Infinity));

/* ---------------- Radial Graph Visualization ---------------- */
function drawRadialGraph(adj, initiator) {
  const size = 700;
  const center = size / 2;
  const layerSpacing = 45;

  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("width", size);
  svg.setAttribute("height", size);

  let layers = {};
  for (let i = 0; i < N; i++) {
    let d = HOP_DIST[i];
    if (d < Infinity) layers[d] = (layers[d] || 0) + 1;
  }

  let layerIndex = {};
  let pos = new Array(N);

  for (let i = 0; i < N; i++) {
    let d = HOP_DIST[i];
    if (d === Infinity) continue;

    layerIndex[d] = (layerIndex[d] || 0) + 1;
    let angle = 2 * Math.PI * layerIndex[d] / layers[d];
    let r = d * layerSpacing;

    pos[i] = {
      x: center + r * Math.cos(angle),
      y: center + r * Math.sin(angle)
    };
  }

  // Edges (light)
  for (let u = 0; u < N; u++) {
    for (let v of adj[u]) {
      if (v <= u || !pos[u] || !pos[v]) continue;
      let line = document.createElementNS(svg.namespaceURI, "line");
      line.setAttribute("x1", pos[u].x);
      line.setAttribute("y1", pos[u].y);
      line.setAttribute("x2", pos[v].x);
      line.setAttribute("y2", pos[v].y);
      line.setAttribute("stroke", "#aaa");
      line.setAttribute("stroke-opacity", "0.15");
      svg.appendChild(line);
    }
  }

  // Nodes
  for (let i = 0; i < N; i++) {
    if (!pos[i]) continue;
    let c = document.createElementNS(svg.namespaceURI, "circle");
    c.setAttribute("cx", pos[i].x);
    c.setAttribute("cy", pos[i].y);
    c.setAttribute("r", i === initiator ? 7 : 3);

    let hue = 240 - (HOP_DIST[i] / MAX_HOP) * 240;
    c.setAttribute(
      "fill",
      i === initiator ? "red" : `hsl(${hue}, 70%, 50%)`
    );

    svg.appendChild(c);
  }

  let div = document.createElement("div");
  div.className = "graph-container";
  div.innerHTML = `<h3>Initiator = ${initiator} (center)</h3>`;
  div.appendChild(svg);
  graphsDiv.appendChild(div);
}

/* ---------------- Election ---------------- */
function runElection() {
  let max = -1, winner = 0;
  for (let i = 0; i < N; i++) {
    let v = Math.random();
    if (v > max) {
      max = v;
      winner = i;
    }
  }
  return winner;
}

/* ---------------- Histogram ---------------- */
function drawHistogram() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const padding = 50;
  const plotHeight = canvas.height - 2 * padding;
  const maxY = 0.0016;
  const fairProb = 1 / N;

  let bins = new Array(NUM_BINS).fill(0);
  for (let i = 0; i < N; i++) {
    bins[Math.floor(i / BIN_SIZE)] += winsPerNode[i];
  }

  let probs = bins.map(b => b / (BIN_SIZE * completedRuns));

  ctx.strokeStyle = "#eee";
  for (let y = 0; y <= maxY; y += 0.0002) {
    let py = padding + plotHeight * (1 - y / maxY);
    ctx.beginPath();
    ctx.moveTo(0, py);
    ctx.lineTo(canvas.width, py);
    ctx.stroke();
  }

  ctx.setLineDash([6, 4]);
  ctx.strokeStyle = "red";
  let fy = padding + plotHeight * (1 - fairProb / maxY);
  ctx.beginPath();
  ctx.moveTo(0, fy);
  ctx.lineTo(canvas.width, fy);
  ctx.stroke();
  ctx.setLineDash([]);

  const barW = canvas.width / NUM_BINS - 6;
  probs.forEach((p, i) => {
    let h = (p / maxY) * plotHeight;
    ctx.fillStyle = "#4a90e2";
    ctx.fillRect(i * (barW + 6), padding + plotHeight - h, barW, h);
  });
}

/* ---------------- Stats ---------------- */
function updateStats() {
  let probs = winsPerNode.map(w => w / completedRuns);

  let mean = probs.reduce((a,b)=>a+b,0)/N;
  let variance = probs.reduce((s,p)=>s+(p-mean)**2,0)/N;

  let sum = probs.reduce((a,b)=>a+b,0);
  let sumSq = probs.reduce((a,b)=>a+b*b,0);
  let fairness = (sum*sum)/(N*sumSq);

  meanVarEl.innerHTML = `
    Mean probability: <strong>${mean.toFixed(7)}</strong><br>
    Variance: <strong>${variance.toExponential(3)}</strong><br><br>
    <strong>Fairness (Jain Index):</strong>
    <span style="color:${fairness > 0.99 ? "green" : "red"}">
      ${fairness.toFixed(6)}
    </span>
  `;
}

/* ---------------- Main Loop ---------------- */
function step() {
  if (completedRuns >= RUNS) {
    statsEl.textContent = `Completed ${RUNS} runs`;
    updateStats();
    return;
  }

  let leader = runElection();
  winsPerNode[leader]++;

  completedRuns++;
  statsEl.textContent = `Runs: ${completedRuns} / ${RUNS}`;

  updateStats();
  drawHistogram();
  requestAnimationFrame(step);
}

/* ---------------- Start ---------------- */
drawRadialGraph(FIXED_GRAPH, FIXED_INITIATOR);
step();
</script>

</body>
</html>
